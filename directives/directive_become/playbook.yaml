- name: 'Demo become directive'
  hosts: web
  vars:
    ansible_ssh_private_key_file: ~/.ssh/admin
  tasks:
    - name: 'list out the users'
      command: getent passwd
    - name: 'becoming another user & executing whoami command'
      command: whoami
      become: yes
      become_user: admin
      become_method: sudo
