 - name: Demo when directive
   hosts: all
   tasks:
     - name: Print ansible_facts for condtions valdaiting
       debug:
         var: ansible_facts
     - name: Install nginx svc using apt module when os_family is Debian or Ubuntu
       apt:
         name: nginx
         state: present
       when: >
         (ansible_facts.hostname == 'web1') and
         (ansible_facts.os_family == 'Debian')  
