all:
  children:
    localhost:
      hosts:
        local:
          ansible_host: $(hostname -i)
          ansible_connection: local
          ansible_port: 22
          ansible_user: root
    web:
      hosts:
        web1:
          ansible_host: {{ lookup('env', 'WEB1_IP') }}
          ansible_connection: ssh
          ansible_port: 22
          ansible_user: root
          ansible_ssh_pass: Passw0rd
    db:
      hosts:
        db1:
          ansible_host: {{ lookup('env', 'DB1_IP') }}
          ansible_connection: ssh
          ansible_port: 22
          ansible_user: root
          ansible_ssh_pass: Passw0rd
    web_db:
      children:
        web:
        db:
